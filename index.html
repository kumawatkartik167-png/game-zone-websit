<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Game Zone 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#050510;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  overflow-x:hidden;
}

/* ================= HEADER ================= */

.hero{
  min-height:270px;
  padding:45px 18px 35px;
  text-align:center;
  background:
    radial-gradient(circle at 20% 30%,#00eaff55,transparent 30%),
    radial-gradient(circle at 80% 70%,#ff00cc55,transparent 30%),
    linear-gradient(135deg,#050510,#15104a,#050510);
}

.hero h1{
  font-size:clamp(38px,9vw,72px);
  color:#00eaff;
  text-shadow:
    0 0 12px #00eaff,
    0 0 30px #008cff;
  margin-bottom:12px;
}

.hero p{
  color:#ccc;
  font-size:18px;
}

.searchBox{
  display:block;
  width:min(700px,92%);
  margin:25px auto 0;
  padding:16px 20px;
  border-radius:30px;
  border:2px solid #00eaff;
  background:#050510dd;
  color:#fff;
  outline:none;
  font-size:17px;
}

.searchBox::placeholder{
  color:#888;
}

/* ================= CATEGORIES ================= */

.categories{
  width:100%;
  display:flex;
  justify-content:center;
  gap:10px;
  padding:18px;
  overflow-x:auto;
  background:#070711;
}

.category{
  flex:none;
  padding:11px 18px;
  border-radius:25px;
  border:1px solid #00eaff;
  background:#101025;
  color:#fff;
  cursor:pointer;
}

.category:hover{
  background:#00eaff22;
}

/* ================= GAME GRID ================= */

.container{
  width:min(1250px,94%);
  margin:auto;
  padding:30px 0 70px;
}

.gameGrid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
  gap:20px;
}

.gameCard{
  min-height:245px;
  padding:22px;
  border-radius:22px;
  background:
    linear-gradient(145deg,#15152f,#080816);
  border:1px solid #29295c;
  transition:.2s;
}

.gameCard:hover{
  transform:translateY(-5px);
  border-color:#00eaff;
  box-shadow:0 0 25px #00eaff33;
}

.gameIcon{
  font-size:55px;
  margin-bottom:10px;
}

.gameCard h2{
  font-size:22px;
  margin-bottom:10px;
}

.gameCard p{
  color:#aaa;
  line-height:1.4;
  min-height:60px;
}

.playBtn{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:none;
  border-radius:13px;
  background:
    linear-gradient(90deg,#7b2cff,#00aaff);
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.playBtn:active{
  transform:scale(.97);
}

.noGames{
  text-align:center;
  color:#999;
  padding:50px;
  font-size:20px;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  color:#777;
  padding:30px;
}

/* ================= GAME SCREEN ================= */

#gameScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:#020208;
}

#gameCanvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  z-index:120;
  display:flex;
  justify-content:space-between;
  gap:8px;
  pointer-events:none;
}

.hud{
  background:#000b;
  border:1px solid #00eaff;
  border-radius:12px;
  padding:9px 13px;
  font-weight:bold;
}

#exitBtn{
  position:absolute;
  top:58px;
  right:12px;
  z-index:130;
  padding:10px 16px;
  border-radius:12px;
  border:1px solid #ff44cc;
  background:#100817;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

/* ================= GAME MESSAGE ================= */

#gameMessage{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:150;
  background:#0009;
}

.messageBox{
  width:min(420px,90%);
  text-align:center;
  padding:30px;
  border-radius:22px;
  background:#09091d;
  border:2px solid #00eaff;
  box-shadow:0 0 35px #00eaff44;
}

.messageBox h2{
  color:#00eaff;
  font-size:35px;
  margin-bottom:12px;
}

.messageBox button{
  width:100%;
  padding:13px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#7b2cff;
  color:white;
  font-weight:bold;
}

/* ================= MOBILE CONTROLS ================= */

#mobileControls{
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  display:none;
  justify-content:space-between;
  padding:0 20px;
  z-index:125;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:12px;
}

.control{
  width:65px;
  height:65px;
  border-radius:50%;
  border:2px solid #00eaff;
  background:#000c;
  color:white;
  font-size:25px;
  pointer-events:auto;
}

@media(max-width:700px){

  .categories{
    justify-content:flex-start;
  }

  #mobileControls{
    display:flex;
  }

  #hud{
    font-size:12px;
  }

  .hud{
    padding:8px;
  }
}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<section class="hero">

  <h1>🎮 GAME ZONE 3D</h1>

  <p>
    Play • Challenge • Score • Have Fun
  </p>

  <input
    id="search"
    class="searchBox"
    type="text"
    placeholder="🔎 Search games..."
  >

</section>


<!-- ================= CATEGORIES ================= -->

<div class="categories">

  <button class="category" data-category="all">
    🎮 All
  </button>

  <button class="category" data-category="racing">
    🏎️ Racing
  </button>

  <button class="category" data-category="action">
    🎯 Action
  </button>

  <button class="category" data-category="arcade">
    🕹️ Arcade
  </button>

  <button class="category" data-category="sports">
    🏀 Sports
  </button>

  <button class="category" data-category="space">
    🚀 Space
  </button>

</div>


<!-- ================= GAMES ================= -->

<main class="container">

  <div id="gameGrid" class="gameGrid"></div>

</main>


<footer>
  🎮 Game Zone 3D — Phase 1
</footer>


<!-- ================= 3D GAME SCREEN ================= -->

<div id="gameScreen">

  <canvas id="gameCanvas"></canvas>

  <div id="hud">

    <div class="hud" id="gameName">
      GAME
    </div>

    <div class="hud">
      ⭐ <span id="score">0</span>
    </div>

    <div class="hud">
      ❤️ <span id="lives">3</span>
    </div>

  </div>


  <button id="exitBtn">
    ✕ Exit
  </button>


  <div id="mobileControls">

    <div class="controlGroup">

      <button class="control" id="leftBtn">
        ◀
      </button>

      <button class="control" id="rightBtn">
        ▶
      </button>

    </div>

    <div class="controlGroup">

      <button class="control" id="actionBtn">
        🔥
      </button>

    </div>

  </div>


  <div id="gameMessage">

    <div class="messageBox">

      <h2 id="messageTitle">
        GAME OVER
      </h2>

      <p>
        Score:
        <b id="finalScore">0</b>
      </p>

      <button id="againBtn">
        🔄 Play Again
      </button>

      <button id="menuBtn">
        🏠 Main Menu
      </button>

    </div>

  </div>

</div>


<!-- ================= THREE.JS ================= -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================================
   GAME DATABASE
===================================================== */

const GAMES = [

  {
    id:"race",
    title:"3D Car Racing",
    icon:"🏎️",
    category:"racing",
    description:
      "Drive your 3D car, avoid traffic and increase your score."
  },

  {
    id:"police",
    title:"3D Police Chase",
    icon:"🚔",
    category:"racing",
    description:
      "Escape the cartoon police car and survive the chase."
  },

  {
    id:"blaster",
    title:"Cartoon Blaster",
    icon:"🎯",
    category:"action",
    description:
      "Hit colorful cartoon targets with energy shots."
  },

  {
    id:"space",
    title:"3D Space Shooter",
    icon:"🚀",
    category:"space",
    description:
      "Fly through space and dodge fictional space objects."
  },

  {
    id:"planet",
    title:"Planet Runner",
    icon:"🪐",
    category:"arcade",
    description:
      "Run through a colorful 3D world and collect points."
  },

  {
    id:"hoops",
    title:"3D Hoops",
    icon:"🏀",
    category:"sports",
    description:
      "Move your player and try to score points."
  },

  {
    id:"blocks",
    title:"Block Smash",
    icon:"🧱",
    category:"arcade",
    description:
      "Break colorful blocks and build your score."
  },

  {
    id:"ufo",
    title:"UFO Dodge",
    icon:"🛸",
    category:"arcade",
    description:
      "Dodge incoming UFO objects and survive."
  },

  {
    id:"target",
    title:"Target Rush",
    icon:"🎯",
    category:"action",
    description:
      "Hit targets quickly and make the highest score."
  },

  {
    id:"reaction",
    title:"Reaction Challenge",
    icon:"⚡",
    category:"arcade",
    description:
      "Move quickly and test your reaction speed."
  }

];


/* =====================================================
   ELEMENTS
===================================================== */

const gameGrid =
  document.getElementById("gameGrid");

const search =
  document.getElementById("search");

const gameScreen =
  document.getElementById("gameScreen");

const canvas =
  document.getElementById("gameCanvas");

const scoreElement =
  document.getElementById("score");

const livesElement =
  document.getElementById("lives");

const gameNameElement =
  document.getElementById("gameName");

const gameMessage =
  document.getElementById("gameMessage");

const finalScore =
  document.getElementById("finalScore");

const messageTitle =
  document.getElementById("messageTitle");


/* =====================================================
   RENDER GAMES
===================================================== */

function renderGames(list){

  gameGrid.innerHTML="";

  if(!list.length){

    gameGrid.innerHTML=
      '<div class="noGames">😔 No games found</div>';

    return;
  }

  list.forEach(function(game){

    const card =
      document.createElement("div");

    card.className="gameCard";

    card.innerHTML=`

      <div class="gameIcon">
        ${game.icon}
      </div>

      <h2>
        ${game.title}
      </h2>

      <p>
        ${game.description}
      </p>

      <button
        class="playBtn"
        data-game="${game.id}">
        ▶ PLAY NOW
      </button>

    `;

    gameGrid.appendChild(card);
  });

}


/* =====================================================
   INITIAL GAME LIST
===================================================== */

renderGames(GAMES);


/* =====================================================
   PLAY BUTTON
===================================================== */

gameGrid.addEventListener(
  "click",
  function(event){

    const button =
      event.target.closest(".playBtn");

    if(!button) return;

    startGame(button.dataset.game);
  }
);


/* =====================================================
   SEARCH
===================================================== */

search.addEventListener(
  "input",
  function(){

    const query =
      search.value
        .trim()
        .toLowerCase();

    const filtered =
      GAMES.filter(function(game){

        return (
          game.title.toLowerCase().includes(query) ||
          game.category.toLowerCase().includes(query) ||
          game.description.toLowerCase().includes(query)
        );

      });

    renderGames(filtered);

  }
);


/* =====================================================
   CATEGORY
===================================================== */

document
  .querySelectorAll(".category")
  .forEach(function(button){

    button.addEventListener(
      "click",
      function(){

        const category =
          button.dataset.category;

        if(category==="all"){

          renderGames(GAMES);

          return;
        }

        renderGames(
          GAMES.filter(function(game){
            return game.category===category;
          })
        );

      }
    );

  });


/* =====================================================
   THREE.JS VARIABLES
===================================================== */

let scene = null;
let camera = null;
let renderer = null;
let clock = null;

let currentGame = null;
let running = false;

let player = null;

let gameObjects = [];
let bullets = [];

let score = 0;
let lives = 3;

let keys = {};


/* =====================================================
   INITIALIZE 3D
===================================================== */

function init3D(){

  if(renderer) return;

  if(typeof THREE === "undefined"){

    alert(
      "3D engine load nahi hua. Internet connection check karo."
    );

    return;
  }


  scene =
    new THREE.Scene();


  scene.background =
    new THREE.Color(0x050515);


  camera =
    new THREE.PerspectiveCamera(
      65,
      window.innerWidth /
      window.innerHeight,
      0.1,
      1000
    );


  camera.position.set(
    0,
    6,
    12
  );


  renderer =
    new THREE.WebGLRenderer({
      canvas:canvas,
      antialias:true
    });


  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );


  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
  );


  const ambient =
    new THREE.AmbientLight(
      0xffffff,
      0.8
    );

  scene.add(ambient);


  const light =
    new THREE.DirectionalLight(
      0xffffff,
      1.4
    );

  light.position.set(
    10,
    15,
    10
  );

  scene.add(light);


  clock =
    new THREE.Clock();


  window.addEventListener(
    "resize",
    resizeGame
  );


  requestAnimationFrame(
    gameLoop
  );
}


/* =====================================================
   START GAME
===================================================== */

function startGame(id){

  init3D();

  if(!renderer) return;


  currentGame=id;
  running=true;

  score=0;
  lives=3;

  clearWorld();


  const selected =
    GAMES.find(
      function(game){
        return game.id===id;
      }
    );


  gameNameElement.textContent =
    selected ? selected.title : "GAME";


  gameScreen.style.display="block";

  gameMessage.style.display="none";


  updateHUD();


  if(id==="race"){
    setupRacing();
  }

  else if(id==="police"){
    setupPolice();
  }

  else if(id==="blaster"){
    setupBlaster();
  }

  else{
    setupArcade(id);
  }

}


/* =====================================================
   CLEAR WORLD
===================================================== */

function clearWorld(){

  gameObjects.forEach(
    function(object){

      scene.remove(object);

    }
  );

  bullets.forEach(
    function(bullet){

      scene.remove(bullet);

    }
  );


  gameObjects=[];
  bullets=[];


  if(player){

    scene.remove(player);

    player=null;
  }


  /* Keep lights */

  while(scene.children.length>2){

    const object =
      scene.children[
        scene.children.length-1
      ];

    scene.remove(object);
  }

}


/* =====================================================
   ROAD
===================================================== */

function createRoad(){

  const ground =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        100,
        1000
      ),
      new THREE.MeshStandardMaterial({
        color:0x111111
      })
    );


  ground.rotation.x =
    -Math.PI/2;


  ground.position.set(
    0,
    -0.3,
    -450
  );


  scene.add(ground);


  const road =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        12,
        1000
      ),
      new THREE.MeshStandardMaterial({
        color:0x292929
      })
    );


  road.rotation.x =
    -Math.PI/2;


  road.position.set(
    0,
    -0.2,
    -450
  );


  scene.add(road);


  for(
    let z=10;
    z>-1000;
    z-=8
  ){

    const line =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .15,
          .04,
          4
        ),
        new THREE.MeshStandardMaterial({
          color:0xffffff
        })
      );


    line.position.set(
      0,
      -0.1,
      z
    );


    scene.add(line);

    gameObjects.push(line);
  }

}


/* =====================================================
   CAR
===================================================== */

function createCar(color){

  const car =
    new THREE.Group();


  const body =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2,
        .6,
        3.8
      ),
      new THREE.MeshStandardMaterial({
        color:color
      })
    );


  body.position.y=.7;

  car.add(body);


  const cabin =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.45,
        .65,
        1.7
      ),
      new THREE.MeshStandardMaterial({
        color:0x172033
      })
    );


  cabin.position.set(
    0,
    1.25,
    -.2
  );


  car.add(cabin);


  const wheelMaterial =
    new THREE.MeshStandardMaterial({
      color:0x050505
    });


  [-1.05,1.05].forEach(
    function(x){

      [-1.15,1.15].forEach(
        function(z){

          const wheel =
            new THREE.Mesh(
              new THREE.CylinderGeometry(
                .38,
                .38,
                .25,
                16
              ),
              wheelMaterial
            );


          wheel.rotation.z =
            Math.PI/2;


          wheel.position.set(
            x,
            .4,
            z
          );


          car.add(wheel);

        }
      );

    }
  );


  return car;
}


/* =====================================================
   RACING SETUP
===================================================== */

function setupRacing(){

  createRoad();


  player =
    createCar(0x00eaff);


  player.position.set(
    0,
    0,
    5
  );


  scene.add(player);


  for(
    let i=0;
    i<5;
    i++
  ){

    const enemy =
      createCar(
        [
          0xff3333,
          0xffff00,
          0xff00ff,
          0x44ff44
        ][
          Math.floor(
            Math.random()*4
          )
        ]
      );


    enemy.position.set(
      [-4,0,4][
        Math.floor(
          Math.random()*3
        )
      ],
      0,
      -30-i*35
    );


    enemy.userData.type="enemy";


    scene.add(enemy);

    gameObjects.push(enemy);
  }


  camera.position.set(
    0,
    5.5,
    11
  );

}


/* =====================================================
   POLICE SETUP
===================================================== */

function setupPolice(){

  createRoad();


  player =
    createCar(0x0088ff);


  player.position.set(
    0,
    0,
    3
  );


  scene.add(player);


  const police =
    createCar(0xffffff);


  police.position.set(
    0,
    0,
    16
  );


  police.userData.type="police";


  scene.add(police);

  gameObjects.push(police);


  camera.position.set(
    0,
    5.5,
    11
  );

}


/* =====================================================
   BLASTER SETUP
===================================================== */

function setupBlaster(){

  const floor =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        35,
        .5,
        35
      ),
      new THREE.MeshStandardMaterial({
        color:0x241c4d
      })
    );


  floor.position.y=-.3;

  scene.add(floor);


  player =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        1,
        1,
        2,
        20
      ),
      new THREE.MeshStandardMaterial({
        color:0x00eaff
      })
    );


  player.position.set(
    0,
    1,
    7
  );


  scene.add(player);


  for(
    let i=0;
    i<7;
    i++
  ){

    spawnTarget();

  }


  camera.position.set(
    0,
    7,
    14
  );

}


/* =====================================================
   TARGET
===================================================== */

function spawnTarget(){

  const target =
    new THREE.Group();


  const colors = [
    0xff3366,
    0xffff00,
    0x00ff99,
    0xff8800,
    0xaa44ff
  ];


  const body =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1,
        20,
        20
      ),
      new THREE.MeshStandardMaterial({
        color:
          colors[
            Math.floor(
              Math.random()*colors.length
            )
