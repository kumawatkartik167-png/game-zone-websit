<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Game Zone 3D</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  background:#050510;
  color:white;
  font-family:Arial,sans-serif;
  overflow-x:hidden;
}

header{
  min-height:230px;
  padding:45px 20px;
  text-align:center;
  background:
    radial-gradient(circle at 20% 30%,#00eaff44,transparent 30%),
    radial-gradient(circle at 80% 70%,#ff00cc44,transparent 30%),
    linear-gradient(135deg,#050510,#15104a,#050510);
}

header h1{
  font-size:clamp(38px,8vw,72px);
  color:#00eaff;
  text-shadow:0 0 20px #00eaff,0 0 50px #0066ff;
}

header p{
  margin-top:12px;
  color:#ccc;
  font-size:18px;
}

.search{
  width:min(700px,90%);
  margin:25px auto 0;
  display:block;
  padding:15px 20px;
  border-radius:30px;
  border:2px solid #00eaff;
  background:#050510cc;
  color:white;
  outline:none;
  font-size:16px;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:18px;
  justify-content:center;
}

.categories button{
  white-space:nowrap;
  border:1px solid #00eaff;
  background:#101025;
  color:white;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
}

.container{
  width:min(1200px,94%);
  margin:auto;
  padding:20px 0 60px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:linear-gradient(145deg,#11112a,#080817);
  border:1px solid #25255a;
  border-radius:20px;
  padding:22px;
  min-height:220px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:#00eaff;
  box-shadow:0 0 25px #00eaff33;
}

.icon{
  font-size:55px;
}

.card h2{
  margin:10px 0;
}

.card p{
  color:#aaa;
  min-height:42px;
}

.play{
  margin-top:18px;
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:linear-gradient(90deg,#7b2cff,#00aaff);
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#gameScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:#020208;
}

#gameCanvas{
  width:100%;
  height:100%;
  display:block;
}

#gameHUD{
  position:absolute;
  top:12px;
  left:12px;
  right:12px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
  z-index:60;
}

.hudBox{
  background:#000b;
  border:1px solid #00eaff;
  border-radius:12px;
  padding:10px 15px;
}

#closeGame{
  position:absolute;
  right:12px;
  top:60px;
  z-index:70;
  padding:10px 15px;
  border:1px solid #ff44cc;
  border-radius:12px;
  background:#100817;
  color:white;
  cursor:pointer;
}

#gameOver{
  display:none;
  position:absolute;
  inset:0;
  z-index:80;
  align-items:center;
  justify-content:center;
  background:#0009;
}

.overBox{
  width:min(400px,90%);
  padding:30px;
  text-align:center;
  background:#09091d;
  border:2px solid #00eaff;
  border-radius:22px;
}

.overBox h2{
  color:#00eaff;
  font-size:35px;
  margin-bottom:12px;
}

.overBox button{
  margin-top:15px;
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#7b2cff;
  color:white;
  font-weight:bold;
}

#mobileControls{
  display:none;
  position:absolute;
  left:0;
  right:0;
  bottom:20px;
  z-index:65;
  justify-content:space-between;
  padding:0 20px;
  pointer-events:none;
}

.controlGroup{
  display:flex;
  gap:12px;
}

.ctrl{
  width:65px;
  height:65px;
  border-radius:50%;
  border:2px solid #00eaff;
  background:#000b;
  color:white;
  font-size:25px;
  pointer-events:auto;
}

footer{
  text-align:center;
  padding:30px;
  color:#777;
}

@media(max-width:700px){
  .categories{justify-content:flex-start}
  #mobileControls{display:flex}
}
</style>
</head>

<body>

<header>
  <h1>🎮 GAME ZONE 3D</h1>
  <p>Play • Challenge • Score • Have Fun</p>
  <input
    id="search"
    class="search"
    placeholder="🔎 Search games..."
    oninput="searchGames()">
</header>

<div class="categories">
  <button onclick="filterGames('all')">All</button>
  <button onclick="filterGames('racing')">🏎️ Racing</button>
  <button onclick="filterGames('action')">🎯 Action</button>
  <button onclick="filterGames('arcade')">🕹️ Arcade</button>
  <button onclick="filterGames('sports')">🏀 Sports</button>
  <button onclick="filterGames('space')">🚀 Space</button>
</div>

<main class="container">
  <div id="gameGrid" class="grid"></div>
</main>

<footer>
  🎮 Game Zone 3D — Phase 1
</footer>


<!-- GAME SCREEN -->

<div id="gameScreen">

  <canvas id="gameCanvas"></canvas>

  <div id="gameHUD">
    <div class="hudBox" id="gameTitle">GAME</div>
    <div class="hudBox">⭐ <span id="score">0</span></div>
    <div class="hudBox">❤️ <span id="lives">3</span></div>
  </div>

  <button id="closeGame" onclick="closeGame()">✕ Exit</button>

  <div id="mobileControls">
    <div class="controlGroup">
      <button class="ctrl" id="leftBtn">◀</button>
      <button class="ctrl" id="rightBtn">▶</button>
    </div>
    <div class="controlGroup">
      <button class="ctrl" id="actionBtn">🔥</button>
    </div>
  </div>

  <div id="gameOver">
    <div class="overBox">
      <h2>GAME OVER</h2>
      <p>Score: <b id="finalScore">0</b></p>
      <button onclick="restartGame()">🔄 Play Again</button>
      <button onclick="closeGame()">🏠 Main Menu</button>
    </div>
  </div>

</div>


<!-- THREE.JS -->

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

/* =====================================
   GAME DATABASE
===================================== */

const games=[

{
 id:"race",
 title:"3D Car Racing",
 icon:"🏎️",
 category:"racing",
 desc:"Drive your car, avoid traffic and increase your score."
},

{
 id:"police",
 title:"3D Police Chase",
 icon:"🚔",
 category:"racing",
 desc:"Escape the cartoon police car and survive the chase."
},

{
 id:"blaster",
 title:"Cartoon Blaster",
 icon:"🎯",
 category:"action",
 desc:"Hit moving cartoon targets with colorful energy shots."
},

{
 id:"space",
 title:"3D Space Shooter",
 icon:"🚀",
 category:"space",
 desc:"Fly through space and destroy fictional space targets."
},

{
 id:"planet",
 title:"Planet Runner",
 icon:"🪐",
 category:"arcade",
 desc:"Run around a colorful 3D planet and collect stars."
},

{
 id:"hoops",
 title:"3D Hoops",
 icon:"🏀",
 category:"sports",
 desc:"Shoot the ball toward the hoop and score points."
},

{
 id:"blocks",
 title:"Block Smash",
 icon:"🧱",
 category:"arcade",
 desc:"Smash colorful blocks and build your high score."
},

{
 id:"ufo",
 title:"UFO Dodge",
 icon:"🛸",
 category:"arcade",
 desc:"Dodge incoming UFOs and survive as long as possible."
},

{
 id:"target",
 title:"Target Rush",
 icon:"🎯",
 category:"action",
 desc:"Hit targets quickly before time runs out."
},

{
 id:"reaction",
 title:"Reaction Challenge",
 icon:"⚡",
 category:"arcade",
 desc:"Test your reaction speed and beat your best score."
}

];


/* =====================================
   GAME LIST
===================================== */

const grid=document.getElementById("gameGrid");

function renderGames(list=games){

  grid.innerHTML="";

  list.forEach(g=>{

    const card=document.createElement("div");

    card.className="card";

    card.innerHTML=`
      <div class="icon">${g.icon}</div>
      <h2>${g.title}</h2>
      <p>${g.desc}</p>
      <button class="play"
        onclick="startGame('${g.id}')">
        ▶ PLAY NOW
      </button>
    `;

    grid.appendChild(card);
  });
}

renderGames();


function filterGames(cat){

  if(cat==="all"){
    renderGames(games);
    return;
  }

  renderGames(
    games.filter(g=>g.category===cat)
  );
}


function searchGames(){

  const q=
    document.getElementById("search")
    .value.toLowerCase();

  renderGames(
    games.filter(g=>
      g.title.toLowerCase().includes(q) ||
      g.category.toLowerCase().includes(q)
    )
  );
}


/* =====================================
   THREE.JS CORE
===================================== */

let scene;
let camera;
let renderer;
let clock;

let currentGame=null;
let running=false;

let player;
let objects=[];
let bullets=[];

let score=0;
let lives=3;

let keys={};

const screen=
  document.getElementById("gameScreen");

const canvas=
  document.getElementById("gameCanvas");


/* =====================================
   INITIALIZE
===================================== */

function init3D(){

  if(renderer) return;

  scene=new THREE.Scene();

  scene.background=
    new THREE.Color(0x050515);

  camera=
    new THREE.PerspectiveCamera(
      65,
      innerWidth/innerHeight,
      .1,
      1000
    );

  camera.position.set(0,6,12);

  renderer=
    new THREE.WebGLRenderer({
      canvas:canvas,
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
  );

  renderer.shadowMap.enabled=true;

  clock=new THREE.Clock();

  const ambient=
    new THREE.AmbientLight(
      0xffffff,
      .75
    );

  scene.add(ambient);

  const sun=
    new THREE.DirectionalLight(
      0xffffff,
      1.4
    );

  sun.position.set(10,15,10);

  scene.add(sun);

  window.addEventListener(
    "resize",
    resize3D
  );

  animate();
}


/* =====================================
   START GAME
===================================== */

function startGame(id){

  init3D();

  currentGame=id;
  running=true;

  score=0;
  lives=3;

  clearScene();

  screen.style.display="block";

  document.getElementById(
    "gameOver"
  ).style.display="none";

  const g=
    games.find(x=>x.id===id);

  document.getElementById(
    "gameTitle"
  ).textContent=
    g ? g.title : "GAME";

  updateHUD();

  if(id==="race")
    setupRace();

  else if(id==="police")
    setupPolice();

  else if(id==="blaster")
    setupBlaster();

  else
    setupArcade(id);
}


/* =====================================
   CLEAR SCENE
===================================== */

function clearScene(){

  objects=[];
  bullets=[];

  while(scene.children.length>2){

    scene.remove(
      scene.children[
        scene.children.length-1
      ]
    );
  }

  player=null;
}


/* =====================================
   ROAD
===================================== */

function createRoad(){

  const ground=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        100,1000
      ),
      new THREE.MeshStandardMaterial({
        color:0x111111
      })
    );

  ground.rotation.x=-Math.PI/2;

  ground.position.set(
    0,-.2,-400
  );

  scene.add(ground);


  const road=
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        12,1000
      ),
      new THREE.MeshStandardMaterial({
        color:0x292929
      })
    );

  road.rotation.x=-Math.PI/2;

  road.position.set(
    0,-.1,-400
  );

  scene.add(road);


  for(let z=10;z>-1000;z-=8){

    const line=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          .15,.03,4
        ),
        new THREE.MeshStandardMaterial({
          color:0xffffff
        })
      );

    line.position.set(
      0,-.08,z
    );

    scene.add(line);

    objects.push(line);
  }
}


/* =====================================
   CAR
===================================== */

function createCar(color){

  const car=
    new THREE.Group();


  const body=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        2,.6,3.8
      ),
      new THREE.MeshStandardMaterial({
        color:color
      })
    );

  body.position.y=.7;

  car.add(body);


  const cabin=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        1.45,.65,1.7
      ),
      new THREE.MeshStandardMaterial({
        color:0x111827
      })
    );

  cabin.position.set(
    0,1.25,-.2
  );

  car.add(cabin);


  for(
    const x of [-1.05,1.05]
  ){

    for(
      const z of [-1.15,1.15]
    ){

      const wheel=
        new THREE.Mesh(
          new THREE.CylinderGeometry(
            .38,.38,.25,16
          ),
          new THREE.MeshStandardMaterial({
            color:0x050505
          })
        );

      wheel.rotation.z=
        Math.PI/2;

      wheel.position.set(
        x,.4,z
      );

      car.add(wheel);
    }
  }

  return car;
}


/* =====================================
   RACING
===================================== */

function setupRace(){

  createRoad();

  player=
    createCar(0x00eaff);

  player.position.set(
    0,0,5
  );

  scene.add(player);


  for(let i=0;i<5;i++){

    const enemy=
      createCar(
        [0xff3333,
         0xffff00,
         0xff00ff,
         0x44ff44]
        [Math.floor(Math.random()*4)]
      );

    enemy.position.set(
      [-4,0,4][
        Math.floor(Math.random()*3)
      ],
      0,
      -30-i*35
    );

    scene.add(enemy);

    objects.push(enemy);
  }

  camera.position.set(
    0,5.5,11
  );
}


/* =====================================
   POLICE CHASE
===================================== */

function setupPolice(){

  createRoad();

  player=
    createCar(0x00aaff);

  player.position.set(
    0,0,3
  );

  scene.add(player);


  const police=
    createCar(0xffffff);

  police.position.set(
    0,0,15
  );

  police.userData.police=true;

  scene.add(police);

  objects.push(police);

  camera.position.set(
    0,5.5,11
  );
}


/* =====================================
   BLASTER
===================================== */

function setupBlaster(){

  const floor=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        35,.5,35
      ),
      new THREE.MeshStandardMaterial({
        color:0x211c45
      })
    );

  floor.position.y=-.3;

  scene.add(floor);


  player=
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        1,1,2,20
      ),
      new THREE.MeshStandardMaterial({
        color:0x00eaff
      })
    );

  player.position.set(
    0,1,7
  );

  scene.add(player);


  for(let i=0;i<7;i++)
    spawnTarget();


  camera.position.set(
    0,7,14
  );
}


/* =====================================
   TARGET
===================================== */

function spawnTarget(){

  const target=
    new THREE.Group();


  const body=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1,20,20
      ),
      new THREE.MeshStandardMaterial({
        color:
          [0xff3366,
           0xffff00,
           0x00ff99,
           0xff8800,
           0xaa44ff]
          [Math.floor(Math.random()*5)]
      })
    );

  target.add(body);


  const eyeMat=
    new THREE.MeshStandardMaterial({
      color:0xffffff
    });


  for(
    const x of [-.35,.35]
  ){

    const eye=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .16,10,10
        ),
        eyeMat
      );

    eye.position.set(
      x,.25,.9
    );

    target.add(eye);
  }


  target.position.set(
    THREE.MathUtils.randFloat(-8,8),
    THREE.MathUtils.randFloat(1,6),
    THREE.MathUtils.randFloat(-12,1)
  );

  scene.add(target);

  objects.push(target);
}


/* =====================================
   OTHER 3D GAMES
===================================== */

function setupArcade(id){

  const floor=
    new THREE.Mesh(
      new THREE.BoxGeometry(
        40,.5,40
      ),
      new THREE.MeshStandardMaterial({
        color:
          id==="space"
          ?0x050525
          :0x202040
      })
    );

  floor.position.y=-.5;

  scene.add(floor);


  player=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1,20,20
      ),
      new THREE.MeshStandardMaterial({
        color:0x00eaff
      })
    );

  player.position.set(
    0,1,5
  );

  scene.add(player);


  for(let i=0;i<8;i++){

    const obj=
      new THREE.Mesh(
        new THREE.BoxGeometry(
          1.5,1.5,1.5
        ),
        new THREE.MeshStandardMaterial({
          color:
            Math.random()*0xffffff
        })
      );

    obj.position.set(
      THREE.MathUtils.randFloat(-10,10),
      THREE.MathUtils.randFloat(1,5),
      THREE.MathUtils.randFloat(-15,3)
    );

    scene.add(obj);

    objects.push(obj);
  }

  camera.position.set(
    0,6,12
  );
}


/* =====================================
   SHOOT
===================================== */

function shoot(){

  if(
    !running ||
    currentGame!=="blaster"
  ) return;


  const bullet=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .16,10,10
      ),
      new THREE.MeshStandardMaterial({
        color:0xffff00
      })
    );

  bullet.position.copy(
    player.position
  );

  bullet.position.y+=1;

  bullet.userData.velocity=
    new THREE.Vector3(
      0,0,-20
    );

  scene.add(bullet);

  bullets.push(bullet);
}


/* =====================================
   UPDATE RACING
===================================== */

function updateRace(dt){

  let move=0;

  if(keys["arrowleft"]||keys["a"])
    move=-1;

  if(keys["arrowright"]||keys["d"])
    move=1;


  player.position.x+=
    move*7*dt;

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -4.5,4.5
    );


  objects.forEach(obj=>{

    if(obj.userData.police)
      return;

    if(obj.position.z===undefined)
      return;

    obj.position.z+=
      12*dt;


    if(obj.position.z>12){

      obj.position.z=
        -100-Math.random()*80;

      obj.position.x=
        [-4,0,4][
          Math.floor(Math.random()*3)
        ];

      score+=10;

      updateHUD();
    }


    if(
      player &&
      player.position.distanceTo(
        obj.position
      )<2
    ){

      obj.position.z=-100;

      lives--;

      updateHUD();

      if(lives<=0)
        gameOver();
    }
  });


  camera.position.x +=
    (player.position.x-
     camera.position.x)*.08;

  camera.lookAt(
    player.position.x,
    0,
    -15
  );

  score+=dt*2;

  updateHUD();
}


/* =====================================
   UPDATE POLICE
===================================== */

function updatePolice(dt){

  let move=0;

  if(keys["arrowleft"]||keys["a"])
    move=-1;

  if(keys["arrowright"]||keys["d"])
    move=1;


  player.position.x+=
    move*7*dt;

  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -4.5,4.5
    );


  objects.forEach(obj=>{

    if(!obj.userData.police)
      return;


    obj.position.x +=
      (player.position.x-
       obj.position.x)
      *dt*.7;


    obj.position.z -=
      dt*2;


    if(obj.position.z<6){

      lives--;

      obj.position.z=12;

      updateHUD();

      if(lives<=0)
        gameOver();
    }
  });


  score+=dt*3;

  updateHUD();


  camera.position.x +=
    (player.position.x-
     camera.position.x)*.08;

  camera.lookAt(
    player.position.x,
    0,
    -10
  );
}


/* =====================================
   UPDATE BLASTER
===================================== */

function updateBlaster(dt){

  if(keys["arrowleft"]||keys["a"])
    player.position.x-=8*dt;

  if(keys["arrowright"]||keys["d"])
    player.position.x+=8*dt;


  player.position.x=
    THREE.MathUtils.clamp(
      player.position.x,
      -10,10
    );


  bullets.forEach((b,i)=>{

    b.position.z+=
      b.userData.velocity.z*dt;


    if(b.position.z<-30){

      scene.remove(b);

      bullets.splice(i,1);

      return;
    }


    objects.forEach((target,j)=>{

      if(
        !target.userData.target
      ) return;


      if(
        b.position.distanceTo(
          target.position
        )<1.4
      ){

        scene.remove(b);
        scene.remove(target);

        bullets.splice(i,1);
        objects.splice(j,1);

        score+=25;

        updateHUD();

        spawnTarget();
      }
    });
  });


  objects.forEach(obj=>{

    if(obj.userData.target){

      obj.position.x +=
        Math.sin(
          Date.now()*.002
        )*.01;

      obj.rotation.y+=
        dt*2;
    }
  });


  camera.lookAt(
    player.position.x,
    1,
    0
  );
}


/* =====================================
   MAKE TARGETS IDENTIFIABLE
===================================== */

const oldSpawnTarget=spawnTarget;

spawnTarget=function(){

  const before=
    objects.length;

  oldSpawnTa
