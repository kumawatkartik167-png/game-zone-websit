<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Game Zone 3D - Phase 1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050510;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}header{text-align:center;padding:38px 15px;background:radial-gradient(circle at 20% 20%,#00eaff35,transparent 30%),radial-gradient(circle at 80% 70%,#ff00cc35,transparent 30%),linear-gradient(135deg,#050510,#181044,#050510)}
h1{font-size:clamp(38px,9vw,70px);margin:0;color:#00eaff;text-shadow:0 0 18px #00eaff,0 0 45px #06f}
header p{color:#ccc}.search{width:min(700px,92%);padding:14px 18px;margin:18px auto 0;display:block;border:1px solid #00eaff;border-radius:30px;background:#060615;color:#fff;outline:0}
.filters{display:flex;gap:8px;padding:14px 4%;overflow:auto;justify-content:center;background:#080811}.filters button{white-space:nowrap}
button{border:0;border-radius:12px;padding:11px 15px;background:linear-gradient(90deg,#702cff,#00aaff);color:#fff;font-weight:bold;cursor:pointer}
main{width:min(1250px,94%);margin:auto;padding:25px 0 60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{padding:20px;min-height:210px;border:1px solid #29295c;border-radius:20px;background:linear-gradient(145deg,#12122b,#080817)}.card:hover{border-color:#00eaff;box-shadow:0 0 25px #00eaff33;transform:translateY(-3px)}
.icon{font-size:50px}.card h2{font-size:21px;margin:8px 0}.card p{color:#aaa;min-height:42px;line-height:1.35}.play{width:100%;margin-top:12px}
footer{text-align:center;color:#777;padding:30px}
#game{display:none;position:fixed;inset:0;background:#020208;z-index:100}#c{position:absolute;inset:0;width:100%;height:100%}
#hud{position:absolute;z-index:110;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.h{background:#000b;border:1px solid #00eaff;border-radius:10px;padding:8px 11px;font-weight:bold}
#exit{position:absolute;z-index:120;right:10px;top:58px;background:#160918;border:1px solid #ff40d8}
#help{position:absolute;z-index:110;left:50%;bottom:10px;transform:translateX(-50%);background:#000b;padding:7px 11px;border-radius:9px;text-align:center;color:#ddd;font-size:13px}
#touch{display:none;position:absolute;z-index:115;bottom:16px;left:0;right:0;justify-content:space-between;padding:0 16px;pointer-events:none}.tg{display:flex;gap:10px}
.ctrl{width:64px;height:64px;border-radius:50%;font-size:24px;padding:0;pointer-events:auto;background:#000b;border:2px solid #00eaff}
#over{display:none;position:absolute;inset:0;z-index:130;background:#000a;align-items:center;justify-content:center}
.box{width:min(390px,90%);padding:28px;text-align:center;background:#09091d;border:2px solid #00eaff;border-radius:22px}.box h2{color:#00eaff;font-size:34px;margin:0 0 10px}.box button{width:100%;margin-top:10px}
@media(max-width:700px){.filters{justify-content:flex-start}#touch{display:flex}#help{bottom:92px;max-width:88%}}
</style>
</head>
<body>
<header>
<h1>🎮 GAME ZONE 3D</h1>
<p>Phase 1 • 10 WebGL 3D browser games</p>
<input id="search" class="search" placeholder="🔎 Search games..." oninput="render()">
</header>
<div class="filters">
<button onclick="cat='all';render()">All</button><button onclick="cat='racing';render()">🏎️ Racing</button>
<button onclick="cat='action';render()">🎯 Action</button><button onclick="cat='space';render()">🚀 Space</button>
<button onclick="cat='arcade';render()">🕹️ Arcade</button>
</div>
<main><div id="grid" class="grid"></div></main>
<footer>Game Zone 3D • Phase 1</footer>

<div id="game">
<canvas id="c"></canvas>
<div id="hud"><div class="h" id="name">GAME</div><div class="h">⭐ <span id="sc">0</span></div><div class="h">❤️ <span id="hp">3</span></div></div>
<button id="exit" onclick="closeGame()">✕ Exit</button>
<div id="help"></div>
<div id="touch"><div class="tg"><button class="ctrl" id="L">◀</button><button class="ctrl" id="R">▶</button></div><button class="ctrl" id="F">🔥</button></div>
<div id="over"><div class="box"><h2>GAME OVER</h2><p>Score: <b id="final">0</b></p><button onclick="restart()">🔄 Play Again</button><button onclick="closeGame()">🏠 Main Menu</button></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";
const G=[
["race","🏎️","3D Neon Racing","racing"],["police","🚔","3D Police Escape","racing"],
["blaster","🎯","3D Cartoon Blaster","action"],["alien","👾","3D Alien Blaster","action"],
["space","🚀","3D Space Shooter","space"],["ufo","🛸","3D UFO Dodge","arcade"],
["tank","🛡️","3D Tank Arena","action"],["target","🎯","3D Target Rush","action"],
["robot","🤖","3D Robot Survival","action"],["runner","⭐","3D Star Runner","arcade"]
];
const desc={race:"3D highway racing with traffic.",police:"Escape the cartoon police car.",blaster:"Colorful energy shots vs moving targets.",alien:"Defend the arena from cartoon aliens.",space:"Fly in 3D space and hit drones.",ufo:"Dodge incoming UFOs.",tank:"Cartoon tank vs moving bots.",target:"Hit glowing targets for points.",robot:"Survive waves of cartoon robots.",runner:"Collect stars and dodge obstacles."};
let cat="all";
function render(){let q=document.getElementById("search").value.toLowerCase();grid.innerHTML="";
G.filter(g=>(cat=="all"||g[3]==cat)&&(!q||(g[2]+" "+desc[g[0]]).toLowerCase().includes(q))).forEach(g=>{
let d=document.createElement("div");d.className="card";d.innerHTML=`<div class="icon">${g[1]}</div><h2>${g[2]}</h2><p>${desc[g[0]]}</p><button class="play" onclick="start('${g[0]}')">▶ PLAY NOW</button>`;grid.appendChild(d)})}
render();

let scene,camera,renderer,clock,mode,player,running=false,score=0,lives=3,t=0;
let objs=[],shots=[],mx=0;const keys={};
const game=document.getElementById("game"),canvas=document.getElementById("c");
function init(){
 if(renderer)return;
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,1200);
 renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 scene.add(new THREE.AmbientLight(0xffffff,.75));let dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(10,15,8);scene.add(dl);
 clock=new THREE.Clock();addEventListener("resize",resize);
 addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.code=="Space")fire()});
 addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
 canvas.addEventListener("pointerdown",()=>{if(isShoot())fire()});
 touch("L",-1);touch("R",1);document.getElementById("F").addEventListener("touchstart",e=>{e.preventDefault();fire()},{passive:false});
 requestAnimationFrame(loop)
}
function touch(id,v){let b=document.getElementById(id);b.addEventListener("touchstart",e=>{e.preventDefault();mx=v},{passive:false});b.addEventListener("touchend",e=>{e.preventDefault();if(mx==v)mx=0},{passive:false})}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function start(id){
 init();mode=id;running=true;score=0;lives=3;t=0;mx=0;clear();game.style.display="block";document.getElementById("over").style.display="none";
 document.getElementById("name").textContent=G.find(x=>x[0]==id)[2];document.getElementById("help").textContent=isShoot()?"A/D or ←/→ + Space/click • Mobile buttons + tap":"A/D or ←/→ • Avoid obstacles";
 hud();
 if(id=="race")race();else if(id=="police")police();else if(id=="tank")tank();else if(id=="runner")runner();else shooter();
}
function closeGame(){running=false;mode=null;game.style.display="none";clear()}
function restart(){if(mode)start(mode)}
function clear(){objs=[];shots=[];player=null;if(!scene)return;while(scene.children.length>2)scene.remove(scene.children[scene.children.length-1])}
function hud(){sc.textContent=Math.floor(score);hp.textContent=lives}
function end(){running=false;final.textContent=Math.floor(score);over.style.display="flex"}
function box(w,h,d,col){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:col}));m.castShadow=true;return m}
function sph(r,col){return new THREE.Mesh(new THREE.SphereGeometry(r,18,18),new THREE.MeshStandardMaterial({color:col}))}
function car(col){let g=new THREE.Group(),b=box(2,.6,3.6,col);b.position.y=.7;g.add(b);let c=box(1.4,.6,1.7,0x182236);c.position.set(0,1.2,-.2);g.add(c);
for(let x of[-1,1])for(let z of[-1,1]){let w=new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.24,14),new THREE.MeshStandardMaterial({color:0x050505}));w.rotation.z=Math.PI/2;w.position.set(x*1.05,.38,z*1.1);g.add(w)}return g}
function road(){let a=box(80,.3,1100,0x101010);a.position.set(0,-.3,-500);scene.add(a);let r=box(12,.2,1100,0x292929);r.position.set(0,-.15,-500);scene.add(r);
for(let z=8;z>-1080;z-=9){let l=box(.12,.04,4,0xffffff);l.position.set(0,0,z);scene.add(l);objs.push(l)}}
function lane(){return[-4,0,4][Math.floor(Math.random()*3)]}
function hit(a,b,r){return a&&b&&a.position.distanceTo(b.position)<r}
function move(dt,lim){let x=0;if(keys["arrowleft"]||keys["a"])x=-1;if(keys["arrowright"]||keys["d"])x=1;if(mx)x=mx;player.position.x=THREE.MathUtils.clamp(player.position.x+x*8*dt,-lim,lim)}
function follow(){camera.position.x+=(player.position.x-camera.position.x)*.08;camera.lookAt(player.position.x,0,-15)}

function race(){road();player=car(0x00eaff);player.position.set(0,0,5);scene.add(player);for(let i=0;i<5;i++){let e=car([0xff3355,0xffdd22,0x55ff66,0xaa55ff][i%4]);e.position.set(lane(),0,-35-i*40);e.userData.traffic=true;scene.add(e);objs.push(e)}camera.position.set(0,5.5,11)}
function updateRace(dt){move(dt,4.5);objs.forEach(o=>{if(!o.userData.traffic)return;o.position.z+=14*dt;if(o.position.z>13){o.position.z=-80-Math.random()*70;o.position.x=lane();score+=10}if(hit(player,o,1.8)){o.position.z=-100;lives--;if(lives<=0)end()}});score+=dt*2;follow();hud()}

function police(){road();player=car(0x00aaff);player.position.set(0,0,3);scene.add(player);let p=car(0xffffff);p.position.set(0,0,17);p.userData.police=true;scene.add(p);objs.push(p);camera.position.set(0,5.5,11)}
function updatePolice(dt){move(dt,4.5);let p=objs[0];p.position.x+=(player.position.x-p.position.x)*dt*.8;p.position.z-=2.5*dt;if(p.position.z<6){p.position.z=15;lives--;if(lives<=0)end()}score+=dt*3;follow();hud()}

function shooter(){let f=box(34,.4,34,mode=="space"?0x05052a:0x171735);f.position.y=-.25;scene.add(f);player=box(1.6,1,1.6,0x00eaff);player.position.set(0,1,8);scene.add(player);camera.position.set(0,7,15);camera.lookAt(0,1,0);for(let i=0;i<7;i++)enemy()}
function isShoot(){return["blaster","alien","space","target","robot"].includes(mode)}
function enemy(){let o=sph(1,[0xff3355,0xffff33,0x33ffcc,0xaa55ff][Math.floor(Math.random()*4)]);if(mode=="alien"||mode=="robot"){o.scale.set(1.15,1.25,.9)}o.position.set(THREE.MathUtils.randFloat(-11,11),THREE.MathUtils.randFloat(.8,5.5),THREE.MathUtils.randFloat(-16,1));o.userData.enemy=true;o.userData.v=.7+Math.random()*1.2;scene.add(o);objs.push(o)}
function fire(){if(!running||!isShoot()||!player)return;let b=sph(.15,0xffff00);b.position.copy(player.position);b.position.y+=.5;b.userData.v=22;scene.add(b);shots.push(b)}
function updateShooter(dt){move(dt,11);if(mode=="space")player.position.y=1.5;
shots.slice().forEach(b=>{b.position.z-=b.userData.v*dt;if(b.position.z<-30){scene.remove(b);shots.splice(shots.indexOf(b),1);return}
for(let o of objs.slice())if(o.userData.enemy&&hit(b,o,1.25)){scene.remove(b);scene.remove(o);shots.splice(shots.indexOf(b),1);objs.splice(objs.indexOf(o),1);score+=25;enemy();break}});
objs.forEach(o=>{if(!o.userData.enemy)return;o.rotation.y+=dt*2;
if(mode=="blaster"||mode=="target")o.position.x+=Math.sin(t*2+o.position.z)*dt*1.5;
else if(mode=="alien"||mode=="robot")o.position.z+=o.userData.v*dt*(1+t*.01);else o.position.z+=o.userData.v*dt*3;
if(o.position.z>9){o.position.z=THREE.MathUtils.randFloat(-16,-6);o.position.x=THREE.MathUtils.randFloat(-11,11);lives--;if(lives<=0)end()}
if(hit(player,o,1.5)&&mode!="target"){lives--;o.position.z=-15;if(lives<=0)end()}});
score+=dt*(mode=="target"?1.5:1);camera.lookAt(player.position.x,1,0);hud()}

function tank(){let f=box(35,.4,35,0x24391f);f.position.y=-.25;scene.add(f);player=box(2,1,2.5,0x35aa55);player.position.set(0,.6,8);scene.add(player);let turret=box(.7,.7,1.8,0x77cc66);turret.position.set(0,1.2,-.4);player.add(turret);camera.position.set(0,7,15);for(let i=0;i<6;i++){let o=car(0xff8844);o.scale.set(.65,.65,.65);o.position.set(THREE.MathUtils.randFloat(-11,11),0,THREE.MathUtils.randFloat(-15,0));o.userData.enemy=true;o.userData.v=1+Math.random();scene.add(o);objs.push(o)}}
function updateTank(dt){move(dt,12);shots.slice().forEach(b=>{b.position.z-=22*dt;if(b.position.z<-30){scene.remove(b);shots.splice(shots.indexOf(b),1);return}for(let o of objs.slice())if(o.userData.enemy&&hit(b,o,1.5)){scene.remove(b);scene.remove(o);shots.splice(shots.indexOf(b),1);objs.splice(objs.indexOf(o),1);score+=30;enemyTank();break}});
objs.forEach(o=>{if(!o.userData.enemy)return;o.position.z+=o.userData.v*dt;if(o.position.z>10){o.position.z=-15;o.position.x=THREE.MathUtils.randFloat(-11,11);lives--;if(lives<=0)end()}});score+=dt;camera.lookAt(player.position.x,1,0);hud()}
function enemyTank(){let o=car(0xff8844);o.scale.set(.65,.65,.65);o.position.set(THREE.MathUtils.randFloat(-11,11),0,-15);o.userData.enemy=true;o.userData.v=1+Math.random();scene.add(o);objs.push(o)}

function runner(){let f=box(35,.3,120,0x101020);f.position.set(0,-.3,-50);scene.add(f);player=box(1.5,1.5,1.5,0x00eaff);player.position.set(0,.8,6);scene.add(player);
for(let i=0;i<8;i++){let s=sph(.45,0xffff33);s.userData.star=true;s.position.set(lane(),1,-12-i*10);scene.add(s);objs.push(s)}
for(let i=0;i<5;i++){let o=box(1.6,1.6,1.6,0xff4466);o.userData.obs=true;o.position.set(lane(),.8,-25-i*25);scene.add(o);objs.push(o)}camera.position.set(0,5,11)}
function updateRunner(dt){move(dt,4.5);objs.forEach(o=>{o.position.z+=12*dt;o.rotation.y+=dt*2;if(o.position.z>10){o.position.z=-70-Math.random()*30;o.position.x=lane()}if(hit(player,o,1.3)){if(o.userData.star){score+=25;o.position.z=-70-Math.random()*30;o.position.x=lane()}else{o.position.z=-70;lives--;if(lives<=0)end()}}});score+=dt*2;follow();hud()}

function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.05);if(running){t+=dt;if(mode=="race")updateRace(dt);else if(mode=="police")updatePolice(dt);else if(mode=="tank")updateTank(dt);else if(mode=="runner")updateRunner(dt);else updateShooter(dt)}renderer.render(scene,camera)}
</script>
</body>
</html>
